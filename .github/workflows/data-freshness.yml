# Data-freshness watch (DATAFLOW.md 4b, zero-PII): a daily cron asks wago.tools whether
# Forever has shipped a new client build. If so, it fetches + regenerates + runs the
# ship gate, then either opens a green release PR (gate passed) or files an issue (gate
# red) so the shipped data never silently drifts behind the live game.
#
# ACTIVATION: needs the GitHub remote only. Tune the schedule as the patch cadence settles.
# SECURITY: action refs pinned to full commit SHAs; Dependabot proposes pin bumps.
name: Data freshness

on:
  schedule:
    - cron: "0 9 * * *"   # daily 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Fetch latest client data + regenerate
        run: |
          python pipeline/fetch.py
          python pipeline/generate.py
      - name: Ship gate on the refreshed data
        id: gate
        run: python pipeline/run_tests.py
      # A real build change leaves generated/*.lua diffs; package the follow-up as a PR.
      # (PR/issue steps are left for activation time so the token + branch policy are the
      # repo owner's choice - the checkout+fetch+generate+gate above is the engine.)
